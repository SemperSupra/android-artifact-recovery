name: Recover public ChatGPT Android archive

on:
  pull_request:
    paths:
      - tools/summarize_android_surface.py
      - .github/workflows/recover-chatgpt-public.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-and-characterize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PACKAGE_ID: com.openai.chatgpt
      EXPECTED_SIGNER_SHA256: b24f4bfbb3cf293f938703b9d87027c1102cc36dc4fa206910e08927db40473c
      APKEEP_VERSION: 1.0.0
      APKEEP_SHA256: a23579a3ba366d25a6d69848189b983d65662f4ecf4b9e11e16510811659de4e
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned apkeep
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/EFForg/apkeep/releases/download/${APKEEP_VERSION}/apkeep-x86_64-unknown-linux-gnu" \
            -o "$RUNNER_TEMP/apkeep"
          echo "${APKEEP_SHA256}  $RUNNER_TEMP/apkeep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/apkeep"
          "$RUNNER_TEMP/apkeep" --version

      - name: Observe APKPure versions and acquire latest available arm64 archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acq" out/chatgpt
          "$RUNNER_TEMP/apkeep" -l -a "$PACKAGE_ID" -d apk-pure \
            -o 'arch=arm64-v8a,output_format=json' | tee out/chatgpt/apkpure-versions.json
          "$RUNNER_TEMP/apkeep" -a "$PACKAGE_ID" -d apk-pure \
            -o 'arch=arm64-v8a' "$RUNNER_TEMP/acq"
          artifact="$(find "$RUNNER_TEMP/acq" -maxdepth 1 -type f \( -name '*.apk' -o -name '*.xapk' \) -print -quit)"
          test -n "$artifact"
          echo "ARTIFACT=$artifact" >> "$GITHUB_ENV"
          sha256sum "$artifact" | tee out/chatgpt/archive-sha256.txt
          printf '{"source":"APKPure via apkeep","package_id":"%s","artifact_name":"%s","artifact_size_bytes":%s}\n' \
            "$PACKAGE_ID" "$(basename "$artifact")" "$(stat -c %s "$artifact")" > out/chatgpt/acquisition-source.json

      - name: Characterize container and code-bearing entries
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/characterize_android_artifact.py "$ARTIFACT" \
            --out out/chatgpt/artifact-characterization.json

      - name: Verify package and official signing identity
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          aapt="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$apksigner" && test -x "$aapt"
          mkdir -p "$RUNNER_TEMP/unpacked"
          case "$ARTIFACT" in
            *.xapk) unzip -q "$ARTIFACT" -d "$RUNNER_TEMP/unpacked" ;;
            *.apk) cp "$ARTIFACT" "$RUNNER_TEMP/unpacked/base.apk" ;;
            *) exit 2 ;;
          esac
          : > out/chatgpt/signers.txt
          while IFS= read -r apk; do
            report="$($apksigner verify --print-certs "$apk")"
            digest="$(printf '%s\n' "$report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
            test "$digest" = "$EXPECTED_SIGNER_SHA256"
            printf '%s %s\n' "$(basename "$apk")" "$digest" >> out/chatgpt/signers.txt
          done < <(find "$RUNNER_TEMP/unpacked" -type f -name '*.apk' | sort)
          base="$(find "$RUNNER_TEMP/unpacked" -type f -name 'com.openai.chatgpt.apk' -print -quit)"
          if [ -z "$base" ]; then
            base="$(find "$RUNNER_TEMP/unpacked" -type f -name 'base.apk' -print -quit)"
          fi
          if [ -z "$base" ]; then
            base="$(find "$RUNNER_TEMP/unpacked" -type f -name '*.apk' -print -quit)"
          fi
          test -n "$base"
          badging="$($aapt dump badging "$base" | head -n 1)"
          printf '%s\n' "$badging" | tee out/chatgpt/base-badging.txt
          printf '%s\n' "$badging" | grep -q "name='$PACKAGE_ID'"
          echo "BASE_APK=$base" >> "$GITHUB_ENV"

      - name: Install pinned JADX and derive bounded behavior surface
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip \
            -o "$RUNNER_TEMP/jadx.zip"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          apkanalyzer="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name apkanalyzer -print -quit || true)"
          if [ -x "$apkanalyzer" ]; then
            "$apkanalyzer" manifest print "$BASE_APK" > "$RUNNER_TEMP/AndroidManifest.xml"
          else
            aapt="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt | sort -V | tail -n1)"
            "$aapt" dump xmltree "$BASE_APK" AndroidManifest.xml > "$RUNNER_TEMP/AndroidManifest.xml"
          fi
          set +e
          "$RUNNER_TEMP/jadx/bin/jadx" --no-res --no-imports --show-bad-code \
            -d "$RUNNER_TEMP/jadx-out" "$BASE_APK" > out/chatgpt/jadx-status.txt 2>&1
          rc=$?
          set -e
          echo "jadx_returncode=$rc" >> out/chatgpt/jadx-status.txt
          test -d "$RUNNER_TEMP/jadx-out"
          python3 tools/summarize_android_surface.py \
            --jadx-root "$RUNNER_TEMP/jadx-out" \
            --manifest "$RUNNER_TEMP/AndroidManifest.xml" \
            --out out/chatgpt/derived-surface.json

      - name: Redact transient proprietary material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/acq" "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/jadx-out" "$RUNNER_TEMP/AndroidManifest.xml" || true

      - name: Publish derived recovery receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-android-derived-recovery
          path: out/chatgpt/
          if-no-files-found: error
          retention-days: 7
