name: Qualify cross-ABI ELF evidence

on:
  pull_request:
    paths:
      - tools/compare_elf_abis.py
      - docs/recovery/cross-abi-elf-evidence.md
      - .github/workflows/qualify-cross-abi-elf-evidence.yml
      - goldens/jni-native/**
  push:
    branches: [main]
    paths:
      - tools/compare_elf_abis.py
      - docs/recovery/cross-abi-elf-evidence.md
      - .github/workflows/qualify-cross-abi-elf-evidence.yml
      - goldens/jni-native/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Ensure Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_path="$(find "$sdk_root" -type f -name sdkmanager | sort | tail -n1)"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build source-known two-ABI JNI golden
        working-directory: goldens/jni-native
        run: gradle --no-daemon assembleRelease

      - name: Extract ABI peers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find goldens/jni-native/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -p "$apk" lib/arm64-v8a/libaar_golden_jni.so > out/libaar_golden_jni-arm64.so
          unzip -p "$apk" lib/x86_64/libaar_golden_jni.so > out/libaar_golden_jni-x86_64.so
          test -s out/libaar_golden_jni-arm64.so
          test -s out/libaar_golden_jni-x86_64.so

      - name: Produce cross-ABI evidence
        run: |
          python3 tools/compare_elf_abis.py             --left out/libaar_golden_jni-arm64.so             --left-abi arm64-v8a             --right out/libaar_golden_jni-x86_64.so             --right-abi x86_64             --logical-name libaar_golden_jni.so             --out out/cross-abi.json

      - name: Qualify conservative semantics
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("out/cross-abi.json"))
          assert d["schema"] == "aar-elf-cross-abi-evidence/v0"
          assert d["left"]["machine"] != d["right"]["machine"]
          assert d["correspondence_evidence"]["shared_defined_dynamic_symbol_count"] >= 1
          assert d["policy"]["filename_match_is_not_identity"] is True
          assert d["policy"]["cross_abi_similarity_is_not_identity"] is True
          assert d["policy"]["cross_abi_evidence_may_select_analysis_oracle"] is True
          assert d["policy"]["raw_strings_emitted"] is False
          assert d["analysis_richness_hint"] in {"arm64-v8a", "x86_64", "TIE"}
          print("cross-abi-qualification=PASS")
          PY

      - name: Publish qualification evidence
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aar-cross-abi-elf-qualification
          path: out/cross-abi.json
          if-no-files-found: error
          retention-days: 14
