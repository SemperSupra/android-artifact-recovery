name: Qualify source-informed methodology evidence
on:
  pull_request:
    paths:
      - '.github/workflows/qualify-source-informed-methodology.yml'
      - 'tools/qualify_method_comparison.py'
      - 'tools/experiment_ndk_jni_art_runtime_v0.py'
      - 'tests/test_qualify_method_comparison.py'
      - 'docs/recovery/source-informed-methodology-rdte-2026-10-13.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-synthetic-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - name: Verify synthetic evidence comparator and existing foundation
        run: |
          python3 -m unittest -v \
            tests/test_qualify_method_comparison.py \
            tests/test_characterize_android_artifact.py \
            tests/test_component_correspondence.py
      - name: Scope attestation
        run: |
          echo "Public-safe source-known fixtures and stdlib tests only."
          echo "No private APK, secrets, authenticated state, or proprietary data."

  android-a2-jni-art-emulator:
    name: A2 native JNI behavior on x86_64 Android 35 ART (one-shot)
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify KVM and build x86_64 NDK 27 JNI and DEX reference
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          python3 tools/experiment_ndk_jni_art_runtime_v0.py --build --root "$RUNNER_TEMP/aar-a2-build"
          test -s "$RUNNER_TEMP/aar-a2-build/build-receipt.json"
      - name: Enable KVM access for ephemeral emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android API 35 x86_64 emulator and verify eight JNI semantic vectors
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 tools/experiment_ndk_jni_art_runtime_v0.py --run-emulator --root "$RUNNER_TEMP/aar-a2-build"
      - name: Retain metadata only; no native ELF/DEX or proprietary SDK material
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-a2-jni-art-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aar-a2-build/build-receipt.json
            ${{ runner.temp }}/aar-a2-runtime-receipt.json
          if-no-files-found: ignore
          retention-days: 14

