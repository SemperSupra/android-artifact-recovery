name: Qualify source-informed methodology evidence
on:
  pull_request:
    paths:
      - '.github/workflows/qualify-source-informed-methodology.yml'
      - 'tools/qualify_method_comparison.py'
      - 'tools/experiment_ndk_jni_ghidra_recovery_v0.py'
      - 'tools/experiment/AarJniHiddenCallgraph.java'
      - 'tests/test_ndk_jni_ghidra_recovery_v0.py'
      - 'tests/test_qualify_method_comparison.py'
      - 'docs/recovery/source-informed-methodology-rdte-2026-10-13.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-synthetic-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - name: Verify synthetic evidence comparator and existing foundation
        run: |
          python3 -m unittest -v \
            tests/test_qualify_method_comparison.py \
            tests/test_characterize_android_artifact.py \
            tests/test_component_correspondence.py
      - name: A3 static oracle negative controls (no NDK or Ghidra)
        run: python3 tests/test_ndk_jni_ghidra_recovery_v0.py
      - name: Scope attestation
        run: |
          echo "Public-safe source-known fixtures and stdlib tests only."
          echo "No private APK, secrets, authenticated state, or proprietary data."

  a4-jni-pseudocode-one-shot:
    name: A4 Ghidra pseudocode characterization one-shot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Produce source-known stripped x86_64 and ARM64 separately
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a4"
          for abi in x86_64 aarch64; do
            python3 tools/experiment_ndk_jni_ghidra_recovery_v0.py --build --abi "$abi" --root "$RUNNER_TEMP/a4"
          done
      - name: Verify pinned official Ghidra
        shell: bash
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/ghidra_12.1.4_PUBLIC_20260921.zip"
          curl -fL --retry 3 --max-time 420 \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip -o "$zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/a4-ghidra"
          unzip -q "$zip" -d "$RUNNER_TEMP/a4-ghidra"
          gd="$RUNNER_TEMP/a4-ghidra/ghidra_12.1.4_PUBLIC"
          test -x "$gd/support/analyzeHeadless"
          echo "A4_GHIDRA=$gd" >> "$GITHUB_ENV"
      - name: Source-blind helper pseudocode projection; do not pass producer source/symbol oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a4-projects"
          for abi in x86_64 aarch64; do
            "$A4_GHIDRA/support/analyzeHeadless" "$RUNNER_TEMP/a4-projects" "aar_a4_$abi" \
              -import "$RUNNER_TEMP/a4/$abi-ghidra-stripped.so" \
              -scriptPath "$GITHUB_WORKSPACE/tools/experiment" \
              -postScript AarJniSemanticEvidence.java "$abi" \
              -analysisTimeoutPerFile 120 -max-cpu 2 -deleteProject \
              2>&1 | tee "$RUNNER_TEMP/a4/$abi-pseudocode.log"
            grep -q 'AAR_A4_COUNT=2' "$RUNNER_TEMP/a4/$abi-pseudocode.log"
          done
      - name: No binary, producer-symbol oracle, logs, or source uploaded
        run: echo "Bounded source-blind Ghidra output visible in public CI logs for RDT&E analysis only"
