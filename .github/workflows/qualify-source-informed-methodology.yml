name: Qualify source-informed methodology evidence
on:
  pull_request:
    paths:
      - '.github/workflows/qualify-source-informed-methodology.yml'
      - 'tools/qualify_method_comparison.py'
      - 'tests/test_qualify_method_comparison.py'
      - 'docs/recovery/source-informed-methodology-rdte-2026-10-13.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-synthetic-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - name: Verify synthetic evidence comparator and existing foundation
        run: |
          python3 -m unittest -v \
            tests/test_qualify_method_comparison.py \
            tests/test_characterize_android_artifact.py \
            tests/test_component_correspondence.py
      - name: Scope attestation
        run: |
          echo "Public-safe source-known fixtures and stdlib tests only."
          echo "No private APK, secrets, authenticated state, or proprietary data."

  a3-source-known-jni-ghidra:
    name: A3 one-shot NDK27 stripped JNI x86 and ARM64 static Ghidra
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: A3 fail-closed independent synthetic oracle tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_ndk_jni_ghidra_recovery_v0.py
      - name: Produce source-owned separate ABI stripped JNI images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a3"
          python3 tools/experiment_ndk_jni_ghidra_recovery_v0.py --build --abi x86_64 --root "$RUNNER_TEMP/a3"
          python3 tools/experiment_ndk_jni_ghidra_recovery_v0.py --build --abi aarch64 --root "$RUNNER_TEMP/a3"
      - name: Download checksum-pinned Ghidra 12.1.4
        shell: bash
        run: |
          set -euo pipefail
          ghidra_zip="$RUNNER_TEMP/ghidra_12.1.4_PUBLIC_20260921.zip"
          curl -fL --retry 3 --retry-all-errors --max-time 420 \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip \
            -o "$ghidra_zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $ghidra_zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/a3-ghidra"
          unzip -q "$ghidra_zip" -d "$RUNNER_TEMP/a3-ghidra"
          gd="$RUNNER_TEMP/a3-ghidra/ghidra_12.1.4_PUBLIC"
          test -x "$gd/support/analyzeHeadless"
          echo "A3_GHIDRA=$gd" >> "$GITHUB_ENV"
      - name: Source-blind static Ghidra callgraph and separate address oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a3-projects"
          for abi in x86_64 aarch64; do
            "$A3_GHIDRA/support/analyzeHeadless" \
              "$RUNNER_TEMP/a3-projects" "aar_a3_$abi" \
              -import "$RUNNER_TEMP/a3/$abi-ghidra-stripped.so" \
              -scriptPath "$GITHUB_WORKSPACE/tools/experiment" \
              -postScript AarJniHiddenCallgraph.java "$abi" \
              -analysisTimeoutPerFile 120 -max-cpu 2 -deleteProject \
              2>&1 | tee "$RUNNER_TEMP/a3/$abi-ghidra.log"
            python3 tools/experiment_ndk_jni_ghidra_recovery_v0.py \
              --verify "$RUNNER_TEMP/a3/$abi-ghidra.log" \
              --abi "$abi" --root "$RUNNER_TEMP/a3"
          done
      - name: Retain only public aggregate outcome, never symbol oracle, ELF or logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aar-a3-aggregate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/a3/*-a3-public-receipt.json
          if-no-files-found: ignore
          retention-days: 14
