name: Probe recovered rebuild feasibility

on:
  pull_request:
    paths:
      - tools/probe_rebuild.py
      - tests/test_probe_rebuild.py
      - docs/recovery/rebuild-feasibility.md
      - .github/workflows/probe-rebuild-feasibility.yml
  push:
    branches:
      - main
    paths:
      - tools/probe_rebuild.py
      - tests/test_probe_rebuild.py
      - docs/recovery/rebuild-feasibility.md
      - .github/workflows/probe-rebuild-feasibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest -v tests/test_probe_rebuild.py

  golden-kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build source-known original
        working-directory: goldens/kotlin-dex
        run: gradle --no-daemon assembleRelease

      - name: Install pinned JADX
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3             https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip             -o "$RUNNER_TEMP/jadx.zip"
          sha256sum "$RUNNER_TEMP/jadx.zip" | tee "$RUNNER_TEMP/jadx.zip.sha256"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"

      - name: Export recovered Gradle project
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find goldens/kotlin-dex/app/build/outputs/apk/release -type f -name '*.apk' | head -n1)"
          mkdir -p out
          set +e
          "$RUNNER_TEMP/jadx/bin/jadx"             --export-gradle             --export-gradle-type android-app             -d out/recovered-gradle             "$apk"
          jadx_rc=$?
          set -e
          echo "$jadx_rc" | tee out/jadx-export-returncode.txt
          test -d out/recovered-gradle
          find out/recovered-gradle -maxdepth 4 -type f | sort | tee out/recovered-gradle-files.txt
          test -s out/recovered-gradle-files.txt

      - name: Probe unmodified recovered rebuild
        run: |
          python3 tools/probe_rebuild.py             --project out/recovered-gradle             --output out/rebuild-report.json             --             gradle --no-daemon assembleDebug
          cat out/rebuild-report.json

      - name: Validate evidence contract
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("out/rebuild-report.json"))
          assert d["schema"] == "aar-rebuild-feasibility/v0"
          assert d["repair_applied"] is False
          assert d["status"] in {"REBUILDABLE-AS-EXPORTED", "NOT-REBUILDABLE-AS-EXPORTED"}
          PY

      - name: Publish rebuild evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aar-rebuild-feasibility-kotlin
          path: |
            out/rebuild-report.json
            out/recovered-gradle-files.txt
            out/jadx-export-returncode.txt
          if-no-files-found: error
          retention-days: 7
