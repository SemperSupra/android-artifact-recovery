name: Qualify passive Android spelunker

on:
  pull_request:
    paths:
      - tools/android_spelunk.py
      - tests/test_android_spelunk.py
      - .github/workflows/qualify-passive-spelunker.yml
  push:
    branches:
      - main
    paths:
      - tools/android_spelunk.py
      - tests/test_android_spelunk.py
      - .github/workflows/qualify-passive-spelunker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest -v tests/test_android_spelunk.py

  emulator:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run passive spelunker on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 3072M
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: false
          script: |
            mkdir -p out
            python3 tools/android_spelunk.py --output out/passive-android-spelunk.json
            python3 -c 'import json; d=json.load(open("out/passive-android-spelunk.json")); assert d["mode"]=="passive" and d["mutation_authorized"] is False and len(d["observations"]) == 12'

      - name: Publish observation
        uses: actions/upload-artifact@v4
        with:
          name: passive-android-spelunk-api35
          path: out/passive-android-spelunk.json
          if-no-files-found: error
          retention-days: 7
