name: Qualify passive Android spelunker

on:
  push:
    branches:
      - mvp/passive-android-spelunker
    paths:
      - tools/android_spelunk.py
      - tests/test_android_spelunk.py
      - .github/workflows/qualify-passive-spelunker.yml

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest -v tests/test_android_spelunk.py
