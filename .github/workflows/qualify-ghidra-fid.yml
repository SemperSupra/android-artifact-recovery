name: Qualify Ghidra headless and FID

on:
  pull_request:
    paths:
      - tools/ghidra/**
      - tools/evaluate_ghidra_fid_goldens.py
      - docs/recovery/ghidra-fid-qualification.md
      - .github/workflows/qualify-ghidra-fid.yml
      - goldens/component-attribution/native/**
  push:
    branches: [main]
    paths:
      - tools/ghidra/**
      - tools/evaluate_ghidra_fid_goldens.py
      - docs/recovery/ghidra-fid-qualification.md
      - .github/workflows/qualify-ghidra-fid.yml
      - goldens/component-attribution/native/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GHIDRA_VERSION: "12.1.4"
      GHIDRA_ZIP: ghidra_12.1.4_PUBLIC_20260921.zip
      GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
      GHIDRA_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build native attribution interview corpus
        shell: bash
        working-directory: goldens/component-attribution/native
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          cc -shared -fPIC -O2 -Wl,-soname,libaarknown.so -o build/libaarknown.so known_component.c
          cp build/libaarknown.so build/libaarknown-exact-copy.so
          cc -shared -fPIC -O0 -Wl,-soname,libaarknown.so -o build/libaarknown-o0.so known_component.c
          cp build/libaarknown.so build/libaarknown-stripped.so
          strip --strip-unneeded build/libaarknown-stripped.so
          cc -shared -fPIC -O2 -Wl,-soname,libaarknown.so -o build/libaarknown-patched.so patched_component.c
          cc -shared -fPIC -O2 -Wl,-soname,libaarknown.so -o build/libaarknown-false-friend.so false_friend.c
          sha256sum build/*.so | sort | tee build/sha256.txt

      - name: Download and verify official Ghidra release
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors "$GHIDRA_URL" -o "$RUNNER_TEMP/$GHIDRA_ZIP"
          echo "$GHIDRA_SHA256  $RUNNER_TEMP/$GHIDRA_ZIP" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/$GHIDRA_ZIP" -d "$RUNNER_TEMP/ghidra"
          ghidra_dir="$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' -print -quit)"
          test -x "$ghidra_dir/support/analyzeHeadless"
          echo "GHIDRA_DIR=$ghidra_dir" >> "$GITHUB_ENV"
          "$ghidra_dir/support/analyzeHeadless" 2>&1 | head -n 8 || true

      - name: Analyze native variants and emit FID evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/ghidra "$RUNNER_TEMP/aar-ghidra-projects"
          for so in             libaarknown.so             libaarknown-exact-copy.so             libaarknown-o0.so             libaarknown-stripped.so             libaarknown-patched.so             libaarknown-false-friend.so
          do
            input="$GITHUB_WORKSPACE/goldens/component-attribution/native/build/$so"
            project="aar_${so//[^A-Za-z0-9_]/_}"
            "$GHIDRA_DIR/support/analyzeHeadless"               "$RUNNER_TEMP/aar-ghidra-projects" "$project"               -import "$input"               -scriptPath "$GITHUB_WORKSPACE/tools/ghidra"               -postScript AarGhidraInventory.java "$GITHUB_WORKSPACE/out/ghidra/$so.inventory.json"               -postScript AarFidHashes.java "$GITHUB_WORKSPACE/out/ghidra/$so.fid.json"               -analysisTimeoutPerFile 120               -max-cpu 2               -deleteProject
          done

      - name: Evaluate headless and FID qualification
        run: |
          python3 tools/evaluate_ghidra_fid_goldens.py             --evidence-dir out/ghidra             --out out/ghidra-fid-qualification.json

      - name: Publish normalized Ghidra qualification evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aar-ghidra-fid-qualification
          path: |
            out/ghidra/*.json
            out/ghidra-fid-qualification.json
            goldens/component-attribution/native/build/sha256.txt
          if-no-files-found: warn
          retention-days: 14
