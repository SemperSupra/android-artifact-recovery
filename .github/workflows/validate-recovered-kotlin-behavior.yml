name: Validate recovered Kotlin behavior

on:
  pull_request:
    paths:
      - tests/fixtures/GoldenFingerprintHarness.java
      - tools/compare_behavior.py
      - tools/repair_jadx_kotlin_java.py
      - tests/test_compare_behavior.py
      - tests/test_repair_jadx_kotlin_java.py
      - docs/recovery/behavioral-validation.md
      - docs/recovery/repair-assisted-kotlin.md
      - .github/workflows/validate-recovered-kotlin-behavior.yml
  push:
    branches:
      - main
    paths:
      - tests/fixtures/GoldenFingerprintHarness.java
      - tools/compare_behavior.py
      - tests/test_compare_behavior.py
      - docs/recovery/behavioral-validation.md
      - .github/workflows/validate-recovered-kotlin-behavior.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest -v tests/test_compare_behavior.py tests/test_repair_jadx_kotlin_java.py

  golden-kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build source-known Kotlin golden
        working-directory: goldens/kotlin-dex
        run: gradle --no-daemon assembleRelease

      - name: Resolve original classpath
        shell: bash
        run: |
          set -euo pipefail
          class_file="$(find goldens/kotlin-dex/app/build -type f -path '*/org/sempersupra/aar/golden/kotlin/GoldenRecordFingerprint.class' -print -quit)"
          test -n "$class_file"
          class_root="$(python3 - "$class_file" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1]).resolve()
          print(p.parents[5])
          PY
          )"
          stdlib="$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib" -type f -name 'kotlin-stdlib-2.0.21.jar' -print -quit)"
          annotations="$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains/annotations" -type f -name '*.jar' ! -name '*sources*' -print -quit || true)"
          test -d "$class_root"
          test -f "$stdlib"
          echo "ORIGINAL_CLASSES=$class_root" >> "$GITHUB_ENV"
          echo "KOTLIN_STDLIB=$stdlib" >> "$GITHUB_ENV"
          echo "JETBRAINS_ANNOTATIONS=$annotations" >> "$GITHUB_ENV"

      - name: Execute source-known oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/original-harness
          cp="$ORIGINAL_CLASSES:$KOTLIN_STDLIB"
          if [ -n "$JETBRAINS_ANNOTATIONS" ]; then cp="$cp:$JETBRAINS_ANNOTATIONS"; fi
          javac -cp "$cp" -d out/original-harness tests/fixtures/GoldenFingerprintHarness.java
          java -cp "out/original-harness:$cp" GoldenFingerprintHarness | tee out/original-observation.txt

      - name: Install pinned JADX
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o "$RUNNER_TEMP/jadx.zip"
          sha256sum "$RUNNER_TEMP/jadx.zip" | tee out/jadx.zip.sha256
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"

      - name: Recover source-like representation
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find goldens/kotlin-dex/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          set +e
          "$RUNNER_TEMP/jadx/bin/jadx" --no-res --no-imports --show-bad-code -d out/jadx "$apk" >out/jadx.stdout.txt 2>out/jadx.stderr.txt
          rc=$?
          set -e
          echo "$rc" > out/jadx.returncode.txt
          recovered_dir="out/jadx/sources/org/sempersupra/aar/golden/kotlin"
          test -d "$recovered_dir"
          find "$recovered_dir" -type f -name '*.java' | sort | tee out/recovered-source-files.txt
          test -s out/recovered-source-files.txt

      - name: Execute recovered candidate if independently compilable
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/recovered-classes out/recovered-harness
          mapfile -t recovered < <(find out/jadx/sources/org/sempersupra/aar/golden/kotlin -type f -name '*.java' | sort)
          cp="$KOTLIN_STDLIB"
          if [ -n "$JETBRAINS_ANNOTATIONS" ]; then cp="$cp:$JETBRAINS_ANNOTATIONS"; fi

          set +e
          javac -cp "$cp" -d out/recovered-classes "${recovered[@]}" >out/recovered-javac.stdout.txt 2>out/recovered-javac.stderr.txt
          compile_rc=$?
          set -e

          if [ "$compile_rc" -ne 0 ]; then
            cat out/recovered-javac.stderr.txt >&2
            echo "state=compile-failed" >> "$GITHUB_OUTPUT"
            echo "detail=javac returned $compile_rc" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          javac -cp "out/recovered-classes:$cp" -d out/recovered-harness tests/fixtures/GoldenFingerprintHarness.java

          set +e
          java -cp "out/recovered-harness:out/recovered-classes:$cp" GoldenFingerprintHarness >out/recovered-observation.txt 2>out/recovered-run.stderr.txt
          run_rc=$?
          set -e

          if [ "$run_rc" -ne 0 ]; then
            echo "state=run-failed" >> "$GITHUB_OUTPUT"
            echo "detail=java returned $run_rc" >> "$GITHUB_OUTPUT"
          else
            echo "state=executed" >> "$GITHUB_OUTPUT"
            echo "detail=independent recovered JVM execution completed" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare original and recovered behavior
        shell: bash
        env:
          CANDIDATE_STATE: ${{ steps.candidate.outputs.state }}
          CANDIDATE_DETAIL: ${{ steps.candidate.outputs.detail }}
        run: |
          set -euo pipefail
          args=(--original out/original-observation.txt --candidate-state "$CANDIDATE_STATE" --candidate-detail "$CANDIDATE_DETAIL" --out out/behavior-comparison.json)
          if [ "$CANDIDATE_STATE" = executed ]; then
            args+=(--candidate out/recovered-observation.txt)
          fi
          python3 tools/compare_behavior.py "${args[@]}"
          cat out/behavior-comparison.json

      - name: Apply bounded repair transform
        shell: bash
        run: |
          set -euo pipefail
          src="out/jadx/sources/org/sempersupra/aar/golden/kotlin/GoldenRecordFingerprint.java"
          dst="out/repaired-sources/org/sempersupra/aar/golden/kotlin/GoldenRecordFingerprint.java"
          python3 tools/repair_jadx_kotlin_java.py \
            --input "$src" \
            --output "$dst" \
            --manifest out/repair-manifest.json
          diff -u "$src" "$dst" > out/repair.diff || true
          cat out/repair-manifest.json

      - name: Execute repair-assisted candidate
        id: repaired
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/repaired-classes out/repaired-harness
          cp="$KOTLIN_STDLIB"
          if [ -n "$JETBRAINS_ANNOTATIONS" ]; then cp="$cp:$JETBRAINS_ANNOTATIONS"; fi
          mapfile -t repaired < <(find out/repaired-sources -type f -name '*.java' | sort)

          set +e
          javac -cp "$cp" -d out/repaired-classes "${repaired[@]}" \
            >out/repaired-javac.stdout.txt 2>out/repaired-javac.stderr.txt
          compile_rc=$?
          set -e

          if [ "$compile_rc" -ne 0 ]; then
            cat out/repaired-javac.stderr.txt >&2
            echo "state=compile-failed" >> "$GITHUB_OUTPUT"
            echo "detail=repair-assisted javac returned $compile_rc" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          javac -cp "out/repaired-classes:$cp" \
            -d out/repaired-harness tests/fixtures/GoldenFingerprintHarness.java

          set +e
          java -cp "out/repaired-harness:out/repaired-classes:$cp" \
            GoldenFingerprintHarness \
            >out/repaired-observation.txt 2>out/repaired-run.stderr.txt
          run_rc=$?
          set -e

          if [ "$run_rc" -ne 0 ]; then
            cat out/repaired-run.stderr.txt >&2
            echo "state=run-failed" >> "$GITHUB_OUTPUT"
            echo "detail=repair-assisted java returned $run_rc" >> "$GITHUB_OUTPUT"
          else
            cat out/repaired-observation.txt
            echo "state=executed" >> "$GITHUB_OUTPUT"
            echo "detail=repair-assisted recovered JVM execution completed" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare repair-assisted behavior
        shell: bash
        env:
          CANDIDATE_STATE: ${{ steps.repaired.outputs.state }}
          CANDIDATE_DETAIL: ${{ steps.repaired.outputs.detail }}
        run: |
          set -euo pipefail
          args=(
            --original out/original-observation.txt
            --candidate-state "$CANDIDATE_STATE"
            --candidate-detail "$CANDIDATE_DETAIL"
            --out out/repair-assisted-behavior-comparison.json
          )
          if [ "$CANDIDATE_STATE" = executed ]; then
            args+=(--candidate out/repaired-observation.txt)
          fi
          python3 tools/compare_behavior.py "${args[@]}"
          cat out/repair-assisted-behavior-comparison.json
          python3 - <<'PY'
          import json
          d=json.load(open("out/repair-assisted-behavior-comparison.json"))
          assert d["status"] == "BEHAVIOR-MATCH", d
          PY

      - name: Publish behavioral evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aar-behavioral-validation-kotlin
          path: out/
          if-no-files-found: error
          retention-days: 7
